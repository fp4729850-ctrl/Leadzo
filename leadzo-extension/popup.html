<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Leadzo AI Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      font-size: 16px;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .status-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.green { background: #10b981; }
    .dot.red { background: #ef4444; }
    
    .instruction {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    a {
      color: #818cf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">L</div>
    <h1>Leadzo AI Cookie Sync</h1>
  </div>
  
  <div class="status-card">
    <div class="status-title">Account Link</div>
    <div class="status-value" id="account-status">
      <div class="dot red"></div> Not Linked
    </div>
  </div>
  
  <div class="instruction" id="instructions">
    Please log into <a href="https://leadzoai.com" target="_blank">leadzoai.com</a> to automatically link this extension.<br><br>
    Once linked, logging into Agoda or Airbnb will securely sync your session to your Leadzo Cloud Scraper.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
